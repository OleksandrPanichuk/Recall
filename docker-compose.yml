services:
  postgres:
    image: postgres:17-alpine
    container_name: recall-postgres
    environment:
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: recall
      POSTGRES_DB: recall
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall -d recall"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - recall-postgres:/var/lib/postgresql/data

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: recall-minio
    command: server /data --console-address ":55091"
    environment:
      MINIO_ROOT_USER: recall
      MINIO_ROOT_PASSWORD: recall-secret
    ports:
      - "127.0.0.1:55090:9000"
      - "127.0.0.1:55091:55091"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - recall-minio:/data

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: recall-mailpit
    ports:
      - "127.0.0.1:55025:1025"
      - "127.0.0.1:55026:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  recall-postgres:
  recall-minio:
