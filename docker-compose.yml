services:
  postgres:
    image: postgres:17-alpine
    container_name: recall-postgres
    environment:
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: recall
      POSTGRES_DB: recall
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall -d recall"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - recall-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: recall-minio
    command: server /data --console-address ":55091"
    environment:
      MINIO_ROOT_USER: recall
      MINIO_ROOT_PASSWORD: recall-secret
    ports:
      - "55090:9000"
      - "55091:55091"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - recall-minio:/data

volumes:
  recall-postgres:
  recall-minio:
