map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
	default $http_x_forwarded_proto;
	''      $scheme;
}

map $http_x_forwarded_host $forwarded_host {
	default $http_x_forwarded_host;
	''      $host;
}

server {
	listen 80;
	listen [::]:80;
	server_name _;

	resolver 127.0.0.11 valid=10s ipv6=off;

	server_tokens off;
	client_max_body_size 8m;
	client_body_timeout 60s;

	proxy_connect_timeout 10s;
	proxy_send_timeout 60s;
	proxy_read_timeout 60s;

	set_real_ip_from 10.0.0.0/8;
	set_real_ip_from 172.16.0.0/12;
	set_real_ip_from 192.168.0.0/16;
	real_ip_header X-Forwarded-For;
	real_ip_recursive on;

	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_min_length 1024;
	gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml application/xml;

	set $api_upstream http://api:8767;
	set $web_upstream http://web:3000;
	set $bot_upstream http://bot:8768;

	location = /healthz {
		access_log off;
		add_header Content-Type text/plain;
		return 200 "ok\n";
	}

	location = /mcp {
		include /etc/nginx/recall-proxy.conf;
		proxy_buffering off;
		proxy_read_timeout 180s;
		proxy_send_timeout 180s;
		proxy_pass $api_upstream$request_uri;
	}

	location ~ ^/bot(?:/|$) {
		return 404;
	}

	location ^~ /telegram/ {
		include /etc/nginx/recall-proxy.conf;
		proxy_pass $bot_upstream$request_uri;
	}

	location ~ ^/(?:api|app|public|health|docs|docs-json|docs-yaml|consent|authorize|token|register|revoke|\.well-known)(?:/|$) {
		include /etc/nginx/recall-proxy.conf;
		proxy_pass $api_upstream$request_uri;
	}

	location / {
		include /etc/nginx/recall-proxy.conf;
		proxy_pass $web_upstream$request_uri;
	}
}
