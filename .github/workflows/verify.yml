name: verify

on:
  pull_request:
  push:
    branches: [main, rewrite]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run verify

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: recall
          POSTGRES_PASSWORD: recall
          POSTGRES_DB: recall
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U recall -d recall"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      minio:
        image: bitnami/minio:2025
        env:
          MINIO_ROOT_USER: recall
          MINIO_ROOT_PASSWORD: recall-secret
        ports:
          - 55090:9000
        options: >-
          --health-cmd "mc ready local"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://recall:recall@127.0.0.1:55432/recall
      OBJECT_STORE_URL: http://127.0.0.1:55090
      OBJECT_STORE_ACCESS_KEY: recall
      OBJECT_STORE_SECRET_KEY: recall-secret
      OBJECT_STORE_BUCKET: recall-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: >-
          bun test
          apps/api/tests/integration/postgres
          apps/api/tests/integration/app
          apps/api/tests/integration/auth
          apps/api/tests/e2e
