name: recall

x-app-build: &app-build
  context: .
  dockerfile: deploy/Dockerfile
  args:
    VITE_API_ORIGIN: ""

services:
  postgres:
    image: postgres:17-alpine
    container_name: recall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.deploy}
      POSTGRES_DB: ${POSTGRES_DB:-recall}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-recall} -d ${POSTGRES_DB:-recall}",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: recall-minio
    restart: unless-stopped
    command: server /data --console-address ":55091"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY:-recall}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_KEY:?set OBJECT_STORE_SECRET_KEY in .env.deploy}
    ports:
      - "127.0.0.1:55090:9000"
      - "127.0.0.1:55091:55091"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - minio:/data

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: recall-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:55026:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    build:
      <<: *app-build
      target: migrate
    image: recall-migrate
    container_name: recall-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-recall}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-recall}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      <<: *app-build
      target: api
    image: recall-api
    container_name: recall-api
    restart: unless-stopped
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8767
      - DATABASE_URL=postgres://${POSTGRES_USER:-recall}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-recall}
      - OBJECT_STORE_URL=http://minio:9000
      - OBJECT_STORE_ACCESS_KEY=${OBJECT_STORE_ACCESS_KEY:-recall}
      - OBJECT_STORE_SECRET_KEY=${OBJECT_STORE_SECRET_KEY}
      - OBJECT_STORE_BUCKET=${OBJECT_STORE_BUCKET:-recall-uploads}
      - BETTER_AUTH_URL=https://${PUBLIC_HOST:?set PUBLIC_HOST in .env.deploy}
      - WEB_APP_URL=https://${PUBLIC_HOST}
      - APP_TIMEZONE
      - BETTER_AUTH_SECRET
      - BOT_API_TOKEN
      - ALLOWED_TELEGRAM_USER_ID
      - AUTH_RATE_LIMIT
      - AUTH_LINK_TTL_SECONDS
      - SIGN_UPS_PER_HOUR
      - MAIL_FROM
      - SMTP_URL
      - MCP_HTTP_TOKEN
      - MCP_HTTP_ALLOWED_HOST
      - MCP_OAUTH_ISSUER
      - MCP_OAUTH_PASSPHRASE
      - ADMIN_PASSPHRASE
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8767/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      <<: *app-build
      target: web
    image: recall-web
    container_name: recall-web
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - RECALL_API_URL=http://api:8767
      - WEB_APP_URL=https://${PUBLIC_HOST}
      - TRUST_PROXY=on
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy

  bot:
    build:
      <<: *app-build
      target: bot
    image: recall-bot
    container_name: recall-bot
    restart: unless-stopped
    environment:
      - RECALL_API_URL=http://api:8767
      - BOT_PORT=8768
      - TELEGRAM_BOT_KEY
      - ALLOWED_TELEGRAM_USER_ID
      - BOT_API_TOKEN
      - APP_TIMEZONE
      - TELEGRAM_API_ROOT
      - TELEGRAM_WEBHOOK_URL
      - TELEGRAM_WEBHOOK_SECRET
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.29-alpine
    container_name: recall-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/recall.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/proxy.conf:/etc/nginx/recall-proxy.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  ngrok:
    image: ngrok/ngrok:3-alpine
    container_name: recall-ngrok
    restart: unless-stopped
    command:
      - http
      - nginx:80
      - --url=https://${PUBLIC_HOST}
      - --log=stdout
      - --log-format=logfmt
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN in .env.deploy}
      NGROK_CONFIG: /etc/ngrok/ngrok.yml
    ports:
      - "127.0.0.1:4040:4040"
    volumes:
      - ./deploy/ngrok/ngrok.yml:/etc/ngrok/ngrok.yml:ro
    depends_on:
      nginx:
        condition: service_healthy

  mcp:
    build:
      <<: *app-build
      target: mcp
    image: recall-mcp
    profiles: ["tools"]
    restart: "no"
    stdin_open: true
    environment:
      - RECALL_API_MCP_URL=http://api:8767/mcp
      - MCP_HTTP_TOKEN
      - RECALL_MCP_TIMEOUT_MS

volumes:
  postgres:
    name: recall-postgres-data
  minio:
    name: recall-minio-data
